version: 2

secret:
  # Paths whose dev-only credentials are documented and intentional.
  ignored-paths:
    # docker-compose.yml ships the default Flowable REST admin password
    # (`test`) and the Postgres user/password (`flowable`/`flowable`).
    # These are public defaults documented in README.md and exist only
    # to make `make stack` work out of the box.
    - "docker-compose.yml"
    # Bruno REST collection holds the same `rest-admin:test` Basic-auth
    # header against the local stack. Contributors are expected to
    # change credentials in the Settings modal at runtime — they are
    # never read from this file.
    - "bruno/**"
    # Allowlist files for other security scanners — they may quote
    # sensitive-looking patterns by name.
    - ".trivyignore"
    - ".gitleaks.toml"

  # Known dev-only credentials baked into the local stack.
  ignored-matches:
    - name: "Dev-only Flowable REST admin password (docker-compose default)"
      match: "rest-admin:test"
    - name: "Dev-only Postgres user/password (docker-compose default)"
      match: "flowable:flowable"
    - name: "Test-fixture prod config for localStorage round-trip (config.test.ts AC-1/AC-5)"
      match: "s3cr3t"
    - name: "Test-fixture credential for NFR-8 redaction-after-setConfig case (request.test.ts Story 8.1)"
      match: "s3cret!"
    - name: "Test-fixture password for createUser Vitest + Playwright (Story 22.1)"
      match: "s3cret"
    - name: "Test-fixture password for updateUser PUT body Vitest (Story 22.2)"
      match: "newpw"
    - name: "Test-fixture password for EditUserModal component test (Story 22.2)"
      match: "new-pw"
    - name: "Test-fixture Bearer token for Add Bearer E2E (Story 23.2)"
      match: "fake-jwt-token"
    - name: "Test-fixture Bearer token for mode-switch E2E (Story 23.2)"
      match: "tok-1"
    - name: "Test-fixture Bearer token for Edit Basic→Bearer E2E (Story 23.2)"
      match: "flip-token"
    - name: "Test-fixture Bearer token for defensive-narrowing E2E (Story 23.2)"
      match: "valid-token"
    - name: "Test-fixture Bearer token for AddConnectionModal mode-switch component test (Story 23.2)"
      match: "tok-xyz"
    - name: "Test-fixture Bearer token for AuthStrategy funnel Vitest (Story 28.1)"
      match: "tok-123"
    - name: "Test-fixture Bearer token for AuthStrategy funnel redaction Vitest (Story 28.1)"
      match: "secret-jwt"
    - name: "Test-fixture Bearer token for multipart funnel Vitest (Story 28.1)"
      match: "up-tok"
    - name: "Test-fixture Bearer token for Auth-tab Save Vitest + E2E (Story 28.2)"
      match: "tok-abc"
