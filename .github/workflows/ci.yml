# Placeholder CI pipeline matching ADR-010 (architecture.md §3).
#
# Five jobs are wired so branch-protection contexts
# (.github/protection/required_checks.json) can be enforced on `main` from
# day one. Each job currently echoes its intent; real implementations land
# during milestone 0.0.1 (Tech Foundation):
#
#   check : ADR-007 Biome v2 + ADR-001 tsc --noEmit          → epic 1
#   unit  : ADR-008 Vitest unit + component tests            → epic 2
#   e2e   : ADR-008 Playwright vs. live flowable-rest:7.2.0  → epic 2
#   build : ADR-002 Vite production build + artifact upload  → epic 4
#   pages : ADR-010 deploy artifact to GitHub Pages (main)   → epic 4
#
# When wiring a real implementation, KEEP the job id (and the `name:` if
# set) — the four required-check contexts `CI / check`, `CI / unit`,
# `CI / e2e`, `CI / build` are hard-coded in branch protection.
#
# All third-party actions are pinned to a full-length commit SHA per
# NFR-26 (and the repo's "Require actions to be pinned to a full-length
# commit SHA" setting). Dependabot's `github-actions` ecosystem bumps the
# SHAs weekly (see .github/dependabot.yml) and keeps the trailing `# vX.Y.Z`
# comment in sync — never strip that comment, it documents the human-
# readable version pin matches.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify SPDX headers
        run: bash scripts/ci/check-spdx.sh

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome (lint + format check)
        id: biome
        run: npx biome ci .

      - name: TypeScript (tsc --noEmit)
        id: tsc
        run: npm run typecheck

      # bpmn-js / dmn-js declare "SEE LICENSE IN LICENSE" in package.json
      # (their LICENSE file is MIT — manually verified). isbot@5.x is
      # Unlicense (public-domain dedication, Apache-2.0-compatible but
      # outside the strict allow-list per NFR-29). Excluded by name; bumps
      # require re-verifying the underlying LICENSE files.
      - name: Verify dependency licenses
        id: licenses
        run: |
          npx license-checker-rseidelsohn \
            --production \
            --onlyAllow 'Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0' \
            --excludePrivatePackages \
            --excludePackagesStartingWith 'bpmn-js;dmn-js' \
            --excludePackages 'isbot@5.1.40' \
            --summary

      - name: Verify NOTICE freshness
        id: notice
        run: node scripts/release/generate-notice.mjs --check

      - name: Verify source file sizes (NFR-21, ≤ 50 KB)
        id: filesize
        run: bash scripts/ci/check-file-size.sh

      - name: Verify README badges in sync with docs/compat.md
        id: badges
        run: node scripts/release/update-readme-badges.mjs --check

      - name: Summary
        if: always()
        run: |
          {
            echo "### check"
            echo ""
            echo "- Biome: ${{ steps.biome.outcome }}"
            echo "- tsc --noEmit: ${{ steps.tsc.outcome }}"
            echo "- License allow-list: ${{ steps.licenses.outcome }}"
            echo "- NOTICE freshness: ${{ steps.notice.outcome }}"
            echo "- File-size limit: ${{ steps.filesize.outcome }}"
            echo "- README badges: ${{ steps.badges.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for vitest browser tier)
        run: npx playwright install --with-deps chromium

      - name: Vitest (unit + browser tiers)
        run: npm run test:all -- --reporter=default --reporter=junit --outputFile.junit=./test-results/junit.xml

      - name: Upload JUnit report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-junit-${{ github.run_id }}
          path: ./test-results/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if [ -f ./test-results/junit.xml ]; then
            tests=$(grep -oE 'tests="[0-9]+"' ./test-results/junit.xml | head -1 | grep -oE '[0-9]+')
            failures=$(grep -oE 'failures="[0-9]+"' ./test-results/junit.xml | head -1 | grep -oE '[0-9]+')
            errors=$(grep -oE 'errors="[0-9]+"' ./test-results/junit.xml | head -1 | grep -oE '[0-9]+')
            {
              echo "### unit"
              echo ""
              echo "- Tests: ${tests:-?}"
              echo "- Failures: ${failures:-?}"
              echo "- Errors: ${errors:-?}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### unit (no JUnit report — Vitest may have crashed before write)" >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Docker stack (postgres + flowable + nginx)
        run: docker compose up -d --wait

      - name: Wait for Flowable engine to be reachable
        id: wait-engine
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS -u rest-admin:test http://localhost:8080/flowable-rest/service/management/engine > /tmp/engine.json 2>/dev/null; then
              echo "engine ready (probe #${i})"
              cat /tmp/engine.json
              exit 0
            fi
            echo "waiting for flowable... (probe #${i})"
            sleep 5
          done
          echo "::error::Flowable engine did not become ready within 180s"
          docker compose ps
          docker compose logs --tail 200 flowable
          exit 1

      - name: Run Playwright E2E
        env:
          CI: "true"
        run: npm run e2e

      - name: Collect Docker logs (on failure)
        if: failure()
        run: docker compose logs --no-color > /tmp/docker-logs.txt || true

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright traces / screenshots / videos (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Docker Compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs-${{ github.run_id }}
          path: /tmp/docker-logs.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### e2e"
            echo ""
            if [ -f /tmp/engine.json ]; then
              version=$(grep -oE '"version":"[^"]+"' /tmp/engine.json | head -1 || echo '"version":"unknown"')
              echo "- Flowable engine: \`${version}\`"
            else
              echo "- Flowable engine: did not respond"
            fi
            image_info=$(docker compose images flowable --format json 2>/dev/null \
              | grep -oE '"Repository":"[^"]+"|"Tag":"[^"]+"' \
              | tr '\n' ' ' || true)
            echo "- Image: \`${image_info:-unknown}\`"
            if [ -f e2e/playwright-report/index.html ]; then
              echo "- Playwright report: see \`playwright-report-${{ github.run_id }}\` artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down Docker stack
        if: always()
        continue-on-error: true
        run: docker compose down -v --remove-orphans

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite production build
        run: npm run build

      - name: Build size summary
        if: always()
        run: |
          if [ -d dist ]; then
            total=$(du -sh dist | awk '{print $1}')
            {
              echo "### build"
              echo ""
              echo "- **Total:** ${total}"
              echo ""
              echo "| Path | Size | Type |"
              echo "|------|------|------|"
              find dist -maxdepth 2 -type f \
                | while read -r f; do
                    size=$(du -h "$f" | awk '{print $1}')
                    rel="${f#dist/}"
                    case "$f" in
                      *.js)   type="JS chunk" ;;
                      *.css)  type="CSS" ;;
                      *.html) type="HTML" ;;
                      *.svg|*.png|*.jpg|*.webp|*.woff2|*.woff|*.ttf|*.eot) type="asset" ;;
                      *)      type="other" ;;
                    esac
                    echo "| \`${rel}\` | ${size} | ${type} |"
                  done | sort
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### build (no dist/ directory — vite build failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowatch-dist-${{ github.run_id }}
          path: dist
          retention-days: 14
          if-no-files-found: error
          compression-level: 6

  pages:
    name: pages
    needs: [check, unit, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Placeholder — deploy artifact to gh-pages
        run: echo "TBD (epic 4) — actions/download-artifact + actions/deploy-pages — see ADR-010"
