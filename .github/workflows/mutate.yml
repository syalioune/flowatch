# SPDX-License-Identifier: Apache-2.0
#
# Stryker mutation testing — scoped to src/api.ts (see stryker.config.mjs).
# Standalone workflow because Stryker is several minutes per file and
# shouldn't slow down the unit hot path. In required_checks.json as
# "Stryker (src/api.ts)" — threshold-gated at 70% (see stryker.config.mjs).
#
# Triggers:
#   - PR to main / develop  → score is computed per-PR; report uploaded
#                              as artifact so reviewers can compare runs.
#   - workflow_dispatch     → on-demand re-run from the Actions UI.
#
# Reproduce locally: `make mutate` — same config file, same scope.
#
# All third-party actions are pinned to a full-length commit SHA per
# NFR-26. Dependabot's `github-actions` ecosystem bumps the SHAs
# weekly and keeps the trailing `# vX.Y.Z` comment in sync.

name: Mutation testing (Stryker)

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mutate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: Stryker (src/api.ts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vitest auto-discovers `vitest.workspace.ts` which defines a
      # `browser` project running on Playwright Chromium. Stryker
      # invokes vitest's full project graph during its initial dry
      # run, so it tries to spin up Chromium even though `src/api.ts`
      # is exercised only by the node/jsdom project. Install Chromium
      # to satisfy vitest's startup; no browser tests actually run in
      # the mutation pass. Matches the install pattern in the `unit`
      # job in ci.yml — Stryker vitest-runner's schema has no
      # project-filter option so we can't sidestep this from config.
      - name: Install Playwright Chromium (vitest browser-tier prerequisite)
        run: npx playwright install --with-deps chromium

      - name: Run Stryker
        id: stryker
        # `|| true` would mask failures — we want a non-zero exit if
        # Stryker itself crashes. The config has NO threshold, so the
        # only way `npx stryker run` exits non-zero is a true error
        # (test runner failure, mutator crash, etc.) — never a low
        # mutation score.
        run: npx stryker run

      - name: Upload mutation HTML report
        if: always() && hashFiles('reports/mutation/index.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### Stryker mutation testing"
            echo ""
            echo "- Scope: \`src/api.ts\` (see stryker.config.mjs)"
            echo "- Outcome: ${{ steps.stryker.outcome }}"
            echo "- Threshold gating: **none** (advisory; see proposal §4.4)"
            echo "- Report: download the \`mutation-report-${{ github.run_id }}\` artifact and open \`index.html\`"
          } >> "$GITHUB_STEP_SUMMARY"
