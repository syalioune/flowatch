<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Flowatch favicon">
  <!-- Same mark, optically tuned for 16x16 rendering:
       - eye outer radius bumped from 6 to 7 (eye dominates more at small size)
       - flow line moved slightly inward (x=4..28 vs 3..29) so it doesn't disappear into the favicon edge
       - stroke widths kept at 2 — renders as a clean 1px at 16x16 — and 2px at 32x32 -->
  <line x1="4" y1="16" x2="28" y2="16"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="7"
          fill="var(--bg, white)"
          stroke="var(--accent, currentColor)" stroke-width="2"/>
  <circle cx="16" cy="16" r="2.5"
          fill="var(--accent, currentColor)"/>
</svg>
