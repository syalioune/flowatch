<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Flowatch mark — eye on a flow line">
  <!-- The flow: horizontal line spanning the mark -->
  <line x1="3" y1="16" x2="29" y2="16"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- The watch: circular eye sitting on the flow line.
       Outer ring is the accent (or currentColor as fallback);
       Inner fill matches background so the eye visibly punches through the line;
       Inner pupil is the accent again. -->
  <circle cx="16" cy="16" r="6"
          fill="var(--bg, white)"
          stroke="var(--accent, currentColor)" stroke-width="2"/>
  <circle cx="16" cy="16" r="2"
          fill="var(--accent, currentColor)"/>
</svg>
