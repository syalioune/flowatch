# Release dry-run — runs semantic-release --dry-run --no-ci on PRs from a
# release/* branch into main (the canonical release PR per docs/release-runbook.md §3).
# Validates the release configuration would emit a clean tag + changelog
# BEFORE the maintainer merges the PR (which would trigger release.yml's
# real publish on main).
#
# Mirrors release.yml env (HUSKY=0, Node from .nvmrc) so the dry-run
# accurately predicts what the real release job would do.
#
# Does NOT publish, tag, or push. The @semantic-release/git and
# @semantic-release/github plugins are no-ops under --dry-run.
#
# Advisory only — NOT added to any branch's required-checks. release/*
# branches are unprotected by design (docs/release-runbook.md §2); main's
# required-checks list is global and would need a "release PRs only"
# carve-out to avoid blocking every non-release PR. The maintainer reads
# the result on the release PR before merge.
#
# Per NFR-26: every third-party action is SHA-pinned to a 40-char commit
# SHA with a `# vX.Y.Z` comment, matching the pins in ci.yml / release.yml
# (single Dependabot bump surface).

name: Release Dry-Run

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-dryrun:
    name: release-dryrun
    # Only run when the PR head is a release/* branch (the canonical release
    # PR shape per docs/release-runbook.md §3). Non-release PRs to main (e.g.
    # CHANGELOG hotfixes per release-runbook.md §7.2) are reported as Skipped.
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # HUSKY=0 disables every husky hook for the job's lifetime — mirrors
      # the env block in release.yml so the dry-run accurately predicts
      # what the real release job would do.
      HUSKY: "0"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # semantic-release walks back to the last released tag to compute
          # the next version, so full history is required.
          fetch-depth: 0
          # Check out the PR head by BRANCH NAME (not the head SHA). A
          # SHA checkout leaves the working tree in detached HEAD;
          # semantic-release then falls back to GITHUB_REF, which in a
          # pull_request event is the synthetic `refs/pull/N/merge` ref
          # — a ref not listed in `branches:` in release.config.mjs, so
          # semantic-release short-circuits with "won't publish from
          # this branch" and never emits a `next release version is …`
          # line for check-dry-run.sh to parse. Release PRs are always
          # same-repo (release/* branches don't come from forks), so
          # head_ref resolves locally and leaves HEAD on the real
          # release branch.
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release --dry-run
        id: dry-run
        env:
          # GITHUB_TOKEN is the default PR token (read-only on fork PRs;
          # contents:read on same-repo PRs). semantic-release skips GitHub
          # API writes under --dry-run; the token is only used to query
          # existing releases for tag-collision detection.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run --no-ci 2>&1 | tee dry-run.log

      - name: Parse dry-run output
        if: always()
        run: bash scripts/release/check-dry-run.sh dry-run.log

      - name: Upload dry-run log (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dryrun-${{ github.run_id }}
          path: dry-run.log
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### release-dryrun"
            echo ""
            echo "- Dry-run: ${{ steps.dry-run.outcome }}"
            if [ -f dry-run.log ]; then
              version=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*' dry-run.log | tail -1 || echo "(none computed)")
              echo "- Computed version: ${version}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
