# CI pipeline — matches ADR-010 (architecture.md §3) after the 0.0.1
# sprint-change proposal that retired the public GitHub Pages demo.
#
# Five jobs run on push / PR / tag (the trailing `image` job is auxiliary):
#
#   check : Biome v2 (ADR-007), tsc --noEmit (ADR-001), SPDX headers,
#           license allow-list, NOTICE freshness, ≤50 KB source-file
#           limit, README-badge drift, commitlint scope-sync.
#   unit  : Vitest unit + browser tiers (ADR-008).
#   e2e   : Playwright golden path vs. live flowable-rest:7.2.0
#           (ADR-008, ADR-012).
#   build : Vite production build + dist artifact upload (ADR-002).
#   image : multi-arch Docker image build + Trivy scan + push to
#           ghcr.io and docker.io on non-PR events. NOT required for
#           branch protection — see the `image:` block's header for
#           secrets / tag strategy / skip rules.
#
# The four required-check contexts (`CI / check`, `CI / unit`,
# `CI / e2e`, `CI / build`) are hard-coded in
# .github/protection/required_checks.json. KEEP the job id (and the
# `name:` if set) when refactoring — renaming silently breaks branch
# protection.
#
# All third-party actions are pinned to a full-length commit SHA per
# NFR-26. Dependabot's `github-actions` ecosystem (.github/dependabot.yml)
# bumps the SHAs weekly and keeps the trailing `# vX.Y.Z` comment in
# sync — never strip that comment, it documents the human-readable
# version pin.

name: CI

on:
  push:
    branches: [main, develop, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify SPDX headers
        run: bash scripts/ci/check-spdx.sh

      - name: Verify Pattern P-001 (fetch funnel)
        run: bash scripts/ci/check-fetch-funnel.sh

      - name: Self-test Pattern P-001 check
        run: bash scripts/ci/__tests__/check-fetch-funnel.test.sh

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Severity threshold MUST match the image-job Trivy step at the top of
      # the image: job (CRITICAL,HIGH + ignore-unfixed: true). The two
      # scans cover different surfaces (fs = package-lock.json + Dockerfile
      # at repo root; image = built layers including the Node runtime and
      # bundled artifacts) and the gate bar should evolve in lockstep —
      # tightening one without the other is a config-drift smell. Per
      # milestone-0.0.1 retro §3.2.
      - name: Run Trivy filesystem scan
        id: trivy-fs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Biome (lint + format check)
        id: biome
        run: npx biome ci .

      - name: TypeScript (tsc --noEmit)
        id: tsc
        run: npm run typecheck

      # bpmn-js / dmn-js / @bpmn-io/form-js-viewer declare "SEE LICENSE IN
      # LICENSE" in package.json (their LICENSE file is MIT — manually
      # verified: https://github.com/bpmn-io/form-js/blob/develop/LICENSE).
      # isbot@5.x is Unlicense (public-domain dedication, Apache-2.0-compatible
      # but outside the strict allow-list per NFR-29). Excluded by name; bumps
      # require re-verifying the underlying LICENSE files.
      - name: Verify dependency licenses
        id: licenses
        run: |
          npx license-checker-rseidelsohn \
            --production \
            --onlyAllow 'Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0' \
            --excludePrivatePackages \
            --excludePackagesStartingWith 'bpmn-js;dmn-js;@bpmn-io/form-js' \
            --excludePackages 'isbot@5.1.40' \
            --summary

      - name: Verify NOTICE freshness
        id: notice
        run: node scripts/release/generate-notice.mjs --check

      - name: Verify commitlint scopes match release.config.mjs THEMES
        id: scope-sync
        run: node scripts/release/check-commitlint-scopes.mjs

      - name: Verify source file sizes (NFR-21, ≤ 50 KB)
        id: filesize
        run: bash scripts/ci/check-file-size.sh

      - name: Verify README badges in sync with docs/compat.md
        id: badges
        run: node scripts/release/update-readme-badges.mjs --check

      - name: Summary
        if: always()
        run: |
          {
            echo "### check"
            echo ""
            echo "- Trivy filesystem scan: ${{ steps['trivy-fs'].outcome }}"
            echo "- Biome: ${{ steps.biome.outcome }}"
            echo "- tsc --noEmit: ${{ steps.tsc.outcome }}"
            echo "- License allow-list: ${{ steps.licenses.outcome }}"
            echo "- NOTICE freshness: ${{ steps.notice.outcome }}"
            echo "- Scope sync: ${{ steps['scope-sync'].outcome }}"
            echo "- File-size limit: ${{ steps.filesize.outcome }}"
            echo "- README badges: ${{ steps.badges.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for vitest browser tier)
        run: npx playwright install --with-deps chromium

      - name: Vitest (unit + browser tiers, with coverage)
        # `test:all` runs the unit + browser projects via the vitest
        # workspace; `--coverage` enables the v8 collector with the
        # curated include set + 60% lines/branches per-file threshold
        # configured in vitest.config.ts. A threshold violation makes
        # vitest exit non-zero, which fails this step (and the job),
        # which fails the required `unit` check on branch protection.
        run: npm run test:all -- --coverage --reporter=default --reporter=junit --outputFile.junit=./test-results/junit.xml

      - name: Upload coverage report
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-junit-${{ github.run_id }}
          path: ./test-results/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if [ -f ./test-results/junit.xml ]; then
            tests=$(grep -oE 'tests="[0-9]+"' ./test-results/junit.xml | head -1 | grep -oE '[0-9]+')
            failures=$(grep -oE 'failures="[0-9]+"' ./test-results/junit.xml | head -1 | grep -oE '[0-9]+')
            errors=$(grep -oE 'errors="[0-9]+"' ./test-results/junit.xml | head -1 | grep -oE '[0-9]+')
            {
              echo "### unit"
              echo ""
              echo "- Tests: ${tests:-?}"
              echo "- Failures: ${failures:-?}"
              echo "- Errors: ${errors:-?}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### unit (no JUnit report — Vitest may have crashed before write)" >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Docker stack (postgres + flowable + nginx)
        run: docker compose up -d --wait

      - name: Wait for Flowable engine to be reachable
        id: wait-engine
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS -u rest-admin:test http://localhost:8080/flowable-rest/service/management/engine > /tmp/engine.json 2>/dev/null; then
              echo "engine ready (probe #${i})"
              cat /tmp/engine.json
              exit 0
            fi
            echo "waiting for flowable... (probe #${i})"
            sleep 5
          done
          echo "::error::Flowable engine did not become ready within 180s"
          docker compose ps
          docker compose logs --tail 200 flowable
          exit 1

      - name: Run Playwright E2E
        env:
          CI: "true"
        run: npm run e2e

      - name: Collect Docker logs (on failure)
        if: failure()
        run: docker compose logs --no-color > /tmp/docker-logs.txt || true

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright traces / screenshots / videos (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Docker Compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs-${{ github.run_id }}
          path: /tmp/docker-logs.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### e2e"
            echo ""
            if [ -f /tmp/engine.json ]; then
              version=$(grep -oE '"version":"[^"]+"' /tmp/engine.json | head -1 || echo '"version":"unknown"')
              echo "- Flowable engine: \`${version}\`"
            else
              echo "- Flowable engine: did not respond"
            fi
            image_info=$(docker compose images flowable --format json 2>/dev/null \
              | grep -oE '"Repository":"[^"]+"|"Tag":"[^"]+"' \
              | tr '\n' ' ' || true)
            echo "- Image: \`${image_info:-unknown}\`"
            if [ -f e2e/playwright-report/index.html ]; then
              echo "- Playwright report: see \`playwright-report-${{ github.run_id }}\` artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down Docker stack
        if: always()
        continue-on-error: true
        run: docker compose down -v --remove-orphans

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite production build
        run: npm run build

      - name: Build size summary
        if: always()
        run: |
          if [ -d dist ]; then
            total=$(du -sh dist | awk '{print $1}')
            {
              echo "### build"
              echo ""
              echo "- **Total:** ${total}"
              echo ""
              echo "| Path | Size | Type |"
              echo "|------|------|------|"
              find dist -maxdepth 2 -type f \
                | while read -r f; do
                    size=$(du -h "$f" | awk '{print $1}')
                    rel="${f#dist/}"
                    case "$f" in
                      *.js)   type="JS chunk" ;;
                      *.css)  type="CSS" ;;
                      *.html) type="HTML" ;;
                      *.svg|*.png|*.jpg|*.webp|*.woff2|*.woff|*.ttf|*.eot) type="asset" ;;
                      *)      type="other" ;;
                    esac
                    echo "| \`${rel}\` | ${size} | ${type} |"
                  done | sort
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### build (no dist/ directory — vite build failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowatch-dist-${{ github.run_id }}
          path: dist
          retention-days: 14
          if-no-files-found: error
          compression-level: 6

  # Build the Flowatch SPA Docker image and publish it to ghcr.io and
  # Docker Hub on push / tag events. Pull requests build (amd64 only, for
  # speed) but never push — secrets are never exposed to PR builds.
  #
  # Tag strategy (via docker/metadata-action):
  #   - main:                    :latest, :sha-<short>
  #   - develop:                 :develop, :sha-<short>
  #   - release/0.0.2:           :release-0.0.2, :sha-<short>
  #   - tag v0.0.2:              :0.0.2, :0.0, :0, :latest, :sha-<short>
  #   - tag v0.0.2-rc1:          :0.0.2-rc1, :sha-<short>   (no :latest, no :major.minor / :major)
  #   - PR (same repo):          (build only — no push, no login)
  #   - PR (from fork):          (skipped — secrets aren't available to fork PRs)
  #
  # Skip rules:
  #   - The `[skip release]` skip applies ONLY to branch pushes (semantic-release's
  #     release commit). Tag pushes always run — the tag itself is what we
  #     want to build for, and tag refs sit on top of [skip release] commits.
  #     Marker is project-local, NOT GitHub Actions' native [skip ci] (which
  #     would also suppress required check / unit / e2e / build jobs).
  #
  # Concurrency:
  #   - The workflow-level concurrency has `cancel-in-progress: true`, which
  #     would otherwise cancel an in-flight `image` job mid-push (leaving
  #     ghcr.io and Docker Hub with partial manifests). The job-level
  #     concurrency below overrides that — never cancel a running push.
  #
  # Secrets required (operator-set — see BOOTSTRAP.md§docker-hub-secrets):
  #   - DOCKERHUB_USERNAME (literal: syalioune)
  #   - DOCKERHUB_TOKEN    (PAT scoped to Read/Write/Delete on
  #                         syalioune/flowatch on Docker Hub)
  #
  # When DOCKERHUB_TOKEN is missing the push step fails red, but the
  # job is intentionally NOT in branch-protection's required_checks.json
  # so merges aren't blocked — `image` is auxiliary, like `release.yml`.
  image:
    name: image
    needs: [check, unit, build]
    # Skip:
    #   - branch pushes whose head commit has [skip release] (release.yml's commit),
    #     EXCEPT for tag events (we always want the tag's image even if the
    #     underlying commit was [skip release]'d).
    #   - PRs from forks (secrets unavailable; cleaner than partial-build).
    if: |
      (startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip release]'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Override the workflow-level cancel-in-progress so a fast-followed push
    # doesn't kill the previous push mid-flight (which can leave one registry
    # with a half-uploaded manifest).
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write         # push to ghcr.io
      id-token: write         # SLSA provenance attestation
      security-events: write  # upload Trivy SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0    # full history so __BUILD_SHA__ resolves correctly

      - name: Setup QEMU (arm64 emulation)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ghcr.io/syalioune/flowatch
            docker.io/syalioune/flowatch
          # Tag rules — read top-to-bottom:
          #   - branch / PR / SHA tags are always safe to emit when their
          #     event type fires.
          #   - semver patterns only emit on tag pushes. Pre-release tags
          #     (containing `-` like `v0.0.2-rc1`) get ONLY :{{version}},
          #     not :{{major}}.{{minor}} or :{{major}}.
          #   - :latest is emitted on default-branch pushes AND on stable
          #     (no hyphen) semver tag pushes. Pre-release tags do NOT move
          #     :latest. The metadata-action `latest` flag false on semver
          #     entries prevents the default behaviour of also emitting
          #     :latest from {{version}}.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=true,latest=false
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }},latest=false
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }},latest=false
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))) }}
          labels: |
            org.opencontainers.image.title=Flowatch
            org.opencontainers.image.description=Modern Flowable 7 REST GUI — BPMN/DMN modeler + runtime operations
            org.opencontainers.image.licenses=Apache-2.0

      # Two-phase build/scan/push pattern:
      #   1. Build amd64 to the local daemon (`load: true`) so Trivy can
      #      scan it. Multi-arch manifest lists don't load to a daemon, so
      #      we need a single-arch local image for the scan target. We
      #      cache the layers to gha so the second buildx call hits cache.
      #   2. Trivy scans the loaded image. CRITICAL vulnerabilities fail
      #      the job (prevents the push from happening). HIGH vulns also
      #      report but don't block — pre-1.0 we tune the bar up over
      #      time. SARIF gets uploaded regardless of step outcome so the
      #      Security tab tracks state across runs.
      #   3. If scan passes, the full multi-arch build runs with `push:
      #      true`. Layers hit the gha cache from step 1, so the second
      #      build is mostly an emulated-arm64 rebuild + push.
      #   4. On PRs, the scan still runs against the locally-loaded amd64
      #      image; the multi-arch push step is skipped via `push: false`.
      - name: Build amd64 to local daemon (for Trivy scan)
        id: build-local
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          # A stable local tag so the scan step can reference it without
          # depending on metadata-action's tag list (which may be empty
          # for some event combinations).
          tags: flowatch:scan
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: flowatch:scan
          # Default scanners cover both OS packages (apk) and language
          # libraries (npm). Both severities listed as gates: fixed or not,
          # CRITICAL+HIGH block the push. `ignore-unfixed: true` lets noise
          # without a fix slip through — operators can rotate it on later
          # by tightening the bar in a follow-up.
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@f411752efdf656cb71aa17b755b22c890960da1d # v3.35.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Build and push (multi-arch)
        # Only runs if the Trivy scan passed (job-step ordering). Cache
        # hit from `build-local` makes this fast on amd64; arm64 still
        # needs to build under qemu.
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### image"
            echo ""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Mode: build-only (PR — no push)"
              echo "- Platforms: linux/amd64"
            else
              echo "- Mode: build + push"
              echo "- Platforms: linux/amd64, linux/arm64"
            fi
            echo "- Trivy scan: ${{ steps.trivy.outcome }} (severity gate: CRITICAL,HIGH; ignore-unfixed: true)"
            echo "- SARIF: uploaded to Security tab (category: trivy-image)"
            echo "- Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - `/' | sed 's/$/`/'
            echo ""
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- Inspect: \`docker buildx imagetools inspect ghcr.io/syalioune/flowatch:sha-$(echo ${{ github.sha }} | cut -c1-7)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
