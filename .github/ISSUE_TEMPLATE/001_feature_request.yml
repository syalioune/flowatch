name: "✨ Feature request"
description: Propose a new capability
labels: ["type:feature", "state:backlog", "priority:medium"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
  - type: textarea
    id: solution
    attributes: { label: Proposed solution }
  - type: textarea
    id: alt
    attributes: { label: Alternatives considered }
  - type: textarea
    id: impact
    attributes: { label: Impact / metrics }