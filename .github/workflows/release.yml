# Release workflow — runs semantic-release on push to main / develop / release/*.
# Per ADR-011 (Conventional Commits → automated release notes) and NFR-26 (SHA-pinned
# actions). All third-party actions pinned to a 40-char commit SHA; Dependabot's
# github-actions ecosystem bumps these weekly (see .github/dependabot.yml).
#
# The workflow is intentionally NOT named in branch-protection's required_checks.json
# — release is allowed to fail (e.g. when no releasable commits exist) without
# blocking merges.

name: Release

on:
  push:
    branches: [main, develop, "release/*"]
  workflow_dispatch: {}

# Default to read-only; the release job scopes up the write permissions it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # Never interrupt a release mid-tag-creation.

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # Skip if the head commit is the [skip ci] release commit from a previous run.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write          # tag + commit CHANGELOG back
      issues: write            # comment on closed issues
      pull-requests: write     # comment on released PRs
      id-token: write          # OIDC for future plugins (npm provenance, etc.)
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0          # semantic-release needs the full git log
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit signatures
        run: npm audit signatures

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
